{% extends "base.html" %}
{% block title %}Вход — EduPage{% endblock %}
{% block content %}<div class="row justify-content-center"><div class="col-md-6 col-lg-4"><div class="card app-card"><div class="card-body p-4">
  <h1 class="h3 mb-4">Вход в EduPage</h1><form method="post">{% csrf_token %}{{ form.non_field_errors }}
  {% for field in form %}<div class="mb-3"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}
  <button class="btn btn-outline-primary w-100" type="submit">Войти</button></form>
</div></div></div></div>{% endblock %}
